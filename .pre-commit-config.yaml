repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: bash -c "cd backend && uv run pyright ."
        language: system
        types: [python]
        pass_filenames: false
        files: ^backend/

      - id: tsc
        name: tsc
        entry: bash -c "cd frontend && npx tsc --noEmit"
        language: system
        types: [ts, tsx]
        pass_filenames: false
        files: ^frontend/

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.0.0-rc.0
    hooks:
      - id: eslint
        files: ^frontend/
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/
